<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بريق — طلب تعاون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

</head>
<body>
<div class="bq " style="--acc: #FFC23D; min-height: 1700px">
<div class="cur-ring" aria-hidden="true"></div>
<div class="cur-dot" aria-hidden="true"></div>
<svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#gr)"></rect></svg>

<header class="nav">
<div class="wrap nav-in">
<a class="logo" href="index.html">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5C12.6 7.6 16.4 11.4 22.5 12C16.4 12.6 12.6 16.4 12 22.5C11.4 16.4 7.6 12.6 1.5 12C7.6 11.4 11.4 7.6 12 1.5Z" fill="var(--acc)"></path></svg>
<span class="disp" style="font-size: 28px; font-weight: 900">بريق</span>
</a>
<a class="btn btn-ghost btn-sm" href="profile.html">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
إلغاء
</a>
</div>
</header>

<section style="padding: 56px 0 96px">
<div class="wrap">


<div>
<div class="fd" style="animation-delay: .05s">
<span class="eyebrow">طلب تعاون</span>
<h1 class="disp h2" style="font-size: clamp(38px, 5vw, 72px)">شنو نوع التعاون؟</h1>
</div>

<!-- progress -->
<div class="fd" style="margin-top: 36px; animation-delay: .15s">
<div style="display: flex; gap: 8px">

<div style="flex: 1">
<div style="height: 6px; border-radius: 6px; background: #2C2936; overflow: hidden"><div style="height: 100%; background: var(--acc); border-radius: 6px; transform-origin: right; transform: scaleX(1); transition: transform .7s cubic-bezier(.7,0,.2,1)"></div></div>
<div style="margin-top: 10px; font-size: 14px; font-weight: 600; color: #F5F2EA">النوع</div>
</div>

<div style="flex: 1">
<div style="height: 6px; border-radius: 6px; background: #2C2936; overflow: hidden"><div style="height: 100%; background: var(--acc); border-radius: 6px; transform-origin: right; transform: scaleX(0); transition: transform .7s cubic-bezier(.7,0,.2,1)"></div></div>
<div style="margin-top: 10px; font-size: 14px; font-weight: 600; color: #8A859B">التفاصيل</div>
</div>

<div style="flex: 1">
<div style="height: 6px; border-radius: 6px; background: #2C2936; overflow: hidden"><div style="height: 100%; background: var(--acc); border-radius: 6px; transform-origin: right; transform: scaleX(0); transition: transform .7s cubic-bezier(.7,0,.2,1)"></div></div>
<div style="margin-top: 10px; font-size: 14px; font-weight: 600; color: #8A859B">الموعد</div>
</div>

<div style="flex: 1">
<div style="height: 6px; border-radius: 6px; background: #2C2936; overflow: hidden"><div style="height: 100%; background: var(--acc); border-radius: 6px; transform-origin: right; transform: scaleX(0); transition: transform .7s cubic-bezier(.7,0,.2,1)"></div></div>
<div style="margin-top: 10px; font-size: 14px; font-weight: 600; color: #8A859B">المراجعة</div>
</div>

</div>
</div>

<div class="split" style="margin-top: 44px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: start">
<div>


<div class="g2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">

<button class="opt pop on" style="animation-delay: 0.00s; min-height: 190px; justify-content: space-between">
<span style="width: 56px; height: 56px; border-radius: 18px; background: var(--acc); color: #0E0D12; display: flex; align-items: center; justify-content: center; transition: all .3s">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg>
</span>
<span>
<span class="disp" style="display: block; font-size: 21px; font-weight: 800">حملة إعلانية</span>
<span style="display: block; margin-top: 6px; color: #B1ACBE; font-size: 15px; line-height: 1.7">ريلز أو ستوري للترويج لمنتجك أو خدمتك.</span>
</span>
</button>

<button class="opt pop " style="animation-delay: 0.07s; min-height: 190px; justify-content: space-between">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #24212D; color: var(--acc); display: flex; align-items: center; justify-content: center; transition: all .3s">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
</span>
<span>
<span class="disp" style="display: block; font-size: 21px; font-weight: 800">حجز موديل</span>
<span style="display: block; margin-top: 6px; color: #B1ACBE; font-size: 15px; line-height: 1.7">جلسة تصوير لمنتجاتك أو إعلان أزياء.</span>
</span>
</button>

<button class="opt pop " style="animation-delay: 0.14s; min-height: 190px; justify-content: space-between">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #24212D; color: var(--acc); display: flex; align-items: center; justify-content: center; transition: all .3s">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z"></path></svg>
</span>
<span>
<span class="disp" style="display: block; font-size: 21px; font-weight: 800">تجربة ومراجعة</span>
<span style="display: block; margin-top: 6px; color: #B1ACBE; font-size: 15px; line-height: 1.7">المؤثر يجرب المنتج ويشارك رأيه بصدق.</span>
</span>
</button>

<button class="opt pop " style="animation-delay: 0.21s; min-height: 190px; justify-content: space-between">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #24212D; color: var(--acc); display: flex; align-items: center; justify-content: center; transition: all .3s">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v18H3zM16 2v4M8 2v4M3 10h18"></path></svg>
</span>
<span>
<span class="disp" style="display: block; font-size: 21px; font-weight: 800">تغطية فعالية</span>
<span style="display: block; margin-top: 6px; color: #B1ACBE; font-size: 15px; line-height: 1.7">حضور افتتاح أو فعالية وتغطيتها مباشرة.</span>
</span>
</button>

</div>








<div style="margin-top: 32px; display: flex; justify-content: space-between; gap: 12px">
<button class="btn btn-ghost" style="visibility: hidden">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
رجوع
</button>
<button class="btn btn-acc mag">التالي<svg class="arr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button>
</div>
</div>

<!-- summary -->
<aside class="side card" aria-label="ملخص الطلب" style="position: sticky; top: 104px; padding: 26px; border-radius: 30px">
<div style="display: flex; align-items: center; gap: 14px">
<div class="ph" style="width: 64px; height: 64px; border-radius: 20px; background: #3B2F7A">
<svg class="sil" viewBox="0 0 200 230" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><circle cx="100" cy="86" r="44" fill="rgba(255,255,255,.25)"></circle><path d="M14 230c4-62 42-100 86-100s82 38 86 100z" fill="rgba(255,255,255,.25)"></path></svg>
</div>
<div>
<div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 18px">نور الهدى<span class="vf"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span></div>
<div style="color: #B1ACBE; font-size: 14px; margin-top: 2px">جمال · بغداد</div>
</div>
</div>
<div style="margin-top: 20px; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid #2C2936; font-size: 15px"><span style="color: #B1ACBE">نوع التعاون</span><span style="font-weight: 600">حملة إعلانية</span></div>
<div style="display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid #2C2936; font-size: 15px"><span style="color: #B1ACBE">المنصات</span><span style="font-weight: 600">إنستغرام</span></div>
<div style="display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid #2C2936; font-size: 15px"><span style="color: #B1ACBE">التسليم</span><span style="font-weight: 600">خلال أسبوع</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 0; border-top: 1px solid #2C2936"><span style="color: #B1ACBE">الإجمالي</span><span class="disp" style="font-size: 26px; font-weight: 900">[السعر]</span></div>
</div>
<div style="margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: #1E1B26; display: flex; gap: 10px; font-size: 14px; color: #B1ACBE; line-height: 1.7">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
ما ينسحب المبلغ إلا بعد موافقتك على المحتوى.
</div>
</aside>
</div>
</div>




</div>
</section>
</div>
